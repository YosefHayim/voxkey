[package]
name = "dufflebag-voice"
version = "0.1.0"
edition = "2021"
description = "Local narration and dictation worker for the Dufflebag voice feature"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
cpal = "0.15.3"
enigo = "0.2.1"
parking_lot = "0.12.4"
rdev = "0.5.3"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
uuid = { version = "1.17.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
